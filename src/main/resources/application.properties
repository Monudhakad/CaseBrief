server.port=8080

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# Feedback storage — controlled app-data directory (not exposed to frontend)
casebrief.feedback.storage-dir=${user.home}/.casebrief/feedback

# Developer contact info (shown in Contact modal; no credentials stored)
casebrief.contact.developer-name=CaseBrief Team
casebrief.contact.github=https://github.com/casebrief
casebrief.contact.email-display=casebrief-dev@example.com

# Logging
logging.level.com.casebrief=INFO
